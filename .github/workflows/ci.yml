name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Variables au niveau du job, pas seulement du build : plusieurs tests importent des modules
    # qui construisent le client Supabase au chargement (`src/lib/supabase.ts` lève sans elles).
    # En local un `.env` masque le problème ; en CI il n'y en a pas.
    # Valeurs de repli pour que la CI ne dépende pas d'un secret configuré ; les secrets du
    # dépôt prennent le dessus s'ils existent.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}
    steps:
      - uses: actions/checkout@v4

      # La version vient du champ `packageManager` de package.json — ne pas la dupliquer ici.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build
